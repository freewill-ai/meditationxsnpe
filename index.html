<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Order Within - Daily Practice</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="header-info">
        <div class="header-actions">
            <button id="capture-btn">SAVE</button>
            <button id="mode-toggle-btn">MODE</button>
        </div>
        <div id="datetime-container" class="datetime"></div>
    </div>
    <div class="container" id="main-container">
        <h1>New Order Within - Daily Practice</h1>
        <div class="button-group">
            <button id="generate-btn">오늘의 수련 생성</button>
            <button id="snpe-basic-btn">SNPE 기본동작</button>
            <button id="intensive-btn">집중 수련</button>
        </div>
        <div id="routine" class="routine-container"></div>
    </div>
    <audio id="start-sound" src="sounds/singing-bowl.mp3"></audio>
    <audio id="completion-sound" src="sounds/singing-bowl2.mp3"></audio>
    <script src="main.js"></script>
</body>
</html>
